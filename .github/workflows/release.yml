name: Release

# GitHub'da bir release yayınlandığında (ör. etiket v1.1.0) eklenti zip'ini
# oluşturup o release'e ekler.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Etiket ve manifest sürümü aynı mı
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Etiket ($TAG) manifest sürümüyle ($VERSION) uyuşmuyor"; exit 1
          fi

      - run: npm test
      - run: npm run build

      - name: Zip'i release'e ekle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.zip --clobber
