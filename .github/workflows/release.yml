name: Release

# When a GitHub release is published (tag e.g. v1.0.0), build the extension
# zip and attach it to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check that the tag matches the manifest version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Tag ($TAG) does not match manifest version ($VERSION)"; exit 1
          fi

      - run: npm test
      - run: npm run build

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.zip --clobber
