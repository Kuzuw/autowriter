name: Bug report
description: Something doesn't work the way you expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Which site?
      placeholder: e.g. docs.google.com, web.whatsapp.com
    validations:
      required: true
  - type: dropdown
    id: start
    attributes:
      label: How did you start it?
      options:
        - Popup (Pick a field and type)
        - Alt+Shift+W shortcut
        - Right-click menu
    validations:
      required: true
  - type: input
    id: layout
    attributes:
      label: Keyboard layout
      placeholder: e.g. English (QWERTY), Turkish Q
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 141, Edge 141, Brave 1.83
  - type: input
    id: version
    attributes:
      label: Autowriter version
      placeholder: Shown at the top of the popup, e.g. v1.0.0
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots or console errors (F12 → Console) help a lot.
