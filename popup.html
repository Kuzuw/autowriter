<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autowriter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <img class="mark" src="icons/icon48.png" width="28" height="28" alt="" />
      <div class="brand">
        <span class="name">Autowriter</span>
        <span class="version" id="version">v1</span>
      </div>
      <a
        class="icon-link"
        href="https://github.com/Kuzuw/autowriter"
        target="_blank"
        rel="noopener"
        data-i18n-title="githubTitle"
        data-i18n-aria-label="githubTitle"
      >
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
      </a>
    </header>

    <!-- Live preview: the real engine typing with your settings, typos included -->
    <section class="page" data-i18n-aria-label="previewLabel">
      <div class="page-text" id="preview" aria-hidden="true"></div>
      <div class="page-meta">
        <span id="metaSpeed"></span>
        <span id="metaFixes" class="fixes"></span>
      </div>
    </section>

    <section class="block">
      <div class="segmented" role="radiogroup" data-i18n-aria-label="sourceLabel">
        <label><input type="radio" name="source" value="clipboard" /><span data-i18n="sourceClipboard"></span></label>
        <label><input type="radio" name="source" value="custom" /><span data-i18n="sourceCustom"></span></label>
      </div>
      <p class="clip" id="clipInfo" data-i18n="clipReading"></p>
      <textarea id="customText" rows="3" data-i18n-placeholder="customPlaceholder" hidden></textarea>
    </section>

    <section class="block">
      <div class="block-head" id="styleHead" data-i18n="styleHead"></div>
      <div class="keys" role="radiogroup" aria-labelledby="styleHead">
        <button class="key" data-preset="calm" role="radio" data-i18n="presetCalm"></button>
        <button class="key" data-preset="natural" role="radio" data-i18n="presetNatural"></button>
        <button class="key" data-preset="fast" role="radio" data-i18n="presetFast"></button>
        <button class="key" data-preset="pro" role="radio" data-i18n="presetPro"></button>
      </div>

      <div class="layout-row">
        <label for="layout" data-i18n="layoutLabel"></label>
        <span class="select">
          <select id="layout">
            <option value="en" data-i18n="layout_en"></option>
            <option value="tr-q" data-i18n="layout_tr_q"></option>
            <option value="tr-f" data-i18n="layout_tr_f"></option>
            <option value="de" data-i18n="layout_de"></option>
            <option value="fr" data-i18n="layout_fr"></option>
            <option value="es" data-i18n="layout_es"></option>
            <option value="dvorak" data-i18n="layout_dvorak"></option>
          </select>
        </span>
      </div>

      <details class="tune" id="tune">
        <summary data-i18n="tune"></summary>
        <div class="slider">
          <label for="wpm" data-i18n="speed"></label>
          <output id="wpmVal"></output>
          <input id="wpm" type="range" min="10" max="200" step="5" />
        </div>
        <div class="slider">
          <label for="typoRate" data-i18n="typoRate"></label>
          <output id="typoVal"></output>
          <input id="typoRate" type="range" min="0" max="15" step="1" />
        </div>
        <div class="slider">
          <label for="startDelay" data-i18n="startDelay"></label>
          <output id="delayVal"></output>
          <input id="startDelay" type="range" min="0" max="10" step="1" />
        </div>
      </details>
    </section>

    <div class="actions">
      <button id="start" class="cta" data-i18n="startBtn"></button>
      <button id="stop" class="ghost" data-i18n="stopBtn"></button>
    </div>
    <p id="msg" class="msg" role="status"></p>

    <dl class="shortcuts">
      <div>
        <dt><kbd>Alt</kbd><kbd>Shift</kbd><kbd>W</kbd></dt>
        <dd data-i18n="scFocused"></dd>
      </div>
      <div>
        <dt><kbd>Esc</kbd></dt>
        <dd data-i18n="scStop"></dd>
      </div>
      <div>
        <dt><kbd data-i18n="scRightClick"></kbd></dt>
        <dd data-i18n="menuTypeHere"></dd>
      </div>
    </dl>

    <script src="engine.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
