<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autowriter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <img class="mark" src="icons/icon48.png" width="28" height="28" alt="" />
      <div class="brand">
        <span class="name">Autowriter</span>
        <span class="version" id="version">v1</span>
      </div>
      <a
        class="icon-link"
        href="https://github.com/Kuzuw/autowriter"
        target="_blank"
        rel="noopener"
        title="GitHub'da aç"
        aria-label="GitHub'da aç"
      >
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
      </a>
    </header>

    <!-- Canlı önizleme: gerçek yazma motoruyla, hatalar ve düzeltmeler dahil -->
    <section class="page" aria-label="Canlı önizleme">
      <div class="page-text" id="preview" aria-hidden="true"></div>
      <div class="page-meta">
        <span id="metaSpeed">55 kelime/dk</span>
        <span id="metaFixes" class="fixes">0 düzeltme</span>
      </div>
    </section>

    <section class="block">
      <div class="segmented" role="radiogroup" aria-label="Metin kaynağı">
        <label><input type="radio" name="source" value="clipboard" /><span>Kopyaladığım metin</span></label>
        <label><input type="radio" name="source" value="custom" /><span>Kendi metnim</span></label>
      </div>
      <p class="clip" id="clipInfo">Panodaki metin okunuyor…</p>
      <textarea id="customText" rows="3" placeholder="Yazılacak metni buraya yapıştır" hidden></textarea>
    </section>

    <section class="block">
      <div class="block-head">
        <span>Yazış tarzı</span>
      </div>
      <div class="keys" role="radiogroup" aria-label="Yazış tarzı">
        <button class="key" data-preset="calm" role="radio">Sakin</button>
        <button class="key" data-preset="natural" role="radio">Doğal</button>
        <button class="key" data-preset="fast" role="radio">Hızlı</button>
        <button class="key" data-preset="pro" role="radio">Usta</button>
      </div>

      <details class="tune" id="tune">
        <summary>İnce ayar</summary>
        <div class="slider">
          <label for="wpm">Hız</label>
          <output id="wpmVal">55 kelime/dk</output>
          <input id="wpm" type="range" min="10" max="200" step="5" />
        </div>
        <div class="slider">
          <label for="typoRate">Hata oranı</label>
          <output id="typoVal">%4</output>
          <input id="typoRate" type="range" min="0" max="15" step="1" />
        </div>
        <div class="slider">
          <label for="startDelay">Başlamadan önce bekle</label>
          <output id="delayVal">2 sn</output>
          <input id="startDelay" type="range" min="0" max="10" step="1" />
        </div>
      </details>
    </section>

    <div class="actions">
      <button id="start" class="cta">Alan seç ve yaz</button>
      <button id="stop" class="ghost">Durdur</button>
    </div>
    <p id="msg" class="msg" role="status"></p>

    <dl class="shortcuts">
      <div>
        <dt><kbd>Alt</kbd><kbd>Shift</kbd><kbd>W</kbd></dt>
        <dd>Odaktaki alana yaz</dd>
      </div>
      <div>
        <dt><kbd>Esc</kbd></dt>
        <dd>Durdur</dd>
      </div>
      <div>
        <dt><kbd>Sağ tık</kbd></dt>
        <dd>Autowriter: metni buraya yaz</dd>
      </div>
    </dl>

    <footer class="credit">
      <span>Kuzuw tarafından yapıldı</span>
      <a class="vibe" href="https://github.com/Kuzuw/autowriter" target="_blank" rel="noopener">vibe coded</a>
    </footer>

    <script src="engine.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
