<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Not defteri</title>
<style>
body{margin:0;background:#eef1f7;font:15px/1.5 system-ui,sans-serif;color:#1b2340}
.wrap{max-width:720px;margin:40px auto;padding:0 20px}
h1{font:600 22px/1.2 Georgia,serif;margin:0 0 6px}
p.s{color:#66708a;margin:0 0 18px}
label{display:block;font-weight:600;margin:14px 0 6px}
input,textarea{width:100%;box-sizing:border-box;border:1px solid #cdd5e4;border-radius:8px;padding:10px 12px;font:16px/1.55 Georgia,serif;background:#fff;color:#1b2340}
textarea{height:190px;resize:none}
[contenteditable]{min-height:60px;border:1px solid #cdd5e4;border-radius:8px;padding:10px 12px;background:#fff}
</style></head><body><div class="wrap">
<h1>Günlük notlar</h1><p class="s">Autowriter deneme sayfası. Eklentiyi yükleyip bu alanlarda dene.</p>
<label for="t">Başlık</label><input id="t" placeholder="Başlık">
<label for="a">Not</label><textarea id="a" placeholder="Bugün neler oldu?"></textarea>
<label>Zengin metin</label><div id="ce" contenteditable="true"></div>
</div></body></html>
